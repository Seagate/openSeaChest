# SPDX-License-Identifier: MPL-2.0
name: MSBuild

permissions: {}

on:
  push:
    branches:
      - master
      - develop
      - release/*
      - feature/*
      - hotfix/*
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: Make/VS.2022

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

jobs:
  build:
    name: MSBuild ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [ x64, x86 ]
        language: ['cpp']

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.14.1
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      continue-on-error: true  # rsync code 24: harmless cleanup-phase race during VM setup
      with:
        persist-credentials: false
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: Restore NuGet packages
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        SOLUTION_FILE_PATH: ${{ env.SOLUTION_FILE_PATH }}
      run: nuget restore $env:SOLUTION_FILE_PATH

    - name: Build
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        BUILD_CONFIGURATION: ${{ env.BUILD_CONFIGURATION }}
        SOLUTION_FILE_PATH: ${{ env.SOLUTION_FILE_PATH }}
        BUILD_PLATFORM: ${{ matrix.platform }}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=$env:BUILD_CONFIGURATION $env:SOLUTION_FILE_PATH /p:Platform=$env:BUILD_PLATFORM
